<body>Загружаем игру…
<script>
(function () {
  var ua = navigator.userAgent;
  var ios = /\bOS (\d+)_/.exec(ua);
  var chrome = /(?:Chrome|CriOS)\/(\d+)/.exec(ua);
  var legacy = (/iPhone|iPad|iPod/.test(ua) && ios && Number(ios[1]) <= 16) ||
    (/Android/.test(ua) && (!chrome || Number(chrome[1]) < 100));
  location.replace((legacy ? 'index.mobile-legacy.html' : 'index.mobile-modern.html') + location.search + location.hash);
})();
</script>
</body>
